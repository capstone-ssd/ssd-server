global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: ssd-app
    metrics_path: /actuator/prometheus
    scheme: https
    static_configs:
      - targets: ['dev-api.simsaimdang.shop']
