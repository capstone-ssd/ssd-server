spring:
  application:
    name: ssd

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  config:
    activate:
      on-profile: local

  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
  data:
    redis:
      host: localhost
      port: 6379

  jwt:
    header: Authorization
    secret: sdvjnfdjnkdvsfjvnjvdksfdljnkvfljovnkf
    access-token-validity-in-seconds: 3600
    refresh-token-validity-in-seconds: 2592000

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            redirect-uri: http://localhost:8080/oauth/kakao/server/callback
            authorization-grant-type: authorization_code
            scope: profile_nickname,profile_image,account_email
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000

app:
  cookie:
    domain: ""
    same-site: None
    secure: false
  storage:
    s3:
      enabled: ${S3_ENABLED:false}
      bucket: ${S3_BUCKET:}
      region: ap-northeast-2
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  oauth:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8080
      - https://dev-api.simsaimdang.shop
      - https://dev.simsaimdang.shop
      - https://ssd-client-zfl2.vercel.app
  external-ai:
    base-url: ${EXTERNAL_AI_BASE_URL}

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: true
  environment: ${SENTRY_ENVIRONMENT:${spring.application.name}}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
