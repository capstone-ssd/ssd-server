plugins {
    id 'org.springframework.boot'
    id 'java'
    id 'jacoco'
}

dependencies {
    implementation project(':ssd-application')
    implementation project(':ssd-domain')
    implementation project(':ssd-common')
    implementation project(':ssd-infra')
    implementation project(':ssd-auth')
    implementation project(':ssd-external')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework:spring-orm'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    implementation 'io.sentry:sentry:7.9.0'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testRuntimeOnly 'com.h2database:h2'
}

jacoco {
    toolVersion = '0.8.12'
}

bootJar {
    layered {
        enabled = true
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required.set(true)
        xml.required.set(true)
        csv.required.set(true)
        html.outputLocation.set(file("${project.layout.buildDirectory.get().asFile}/reports/jacoco/index/html"))
        xml.outputLocation.set(file("${project.layout.buildDirectory.get().asFile}/reports/jacoco/index/jacoco.xml"))
        csv.outputLocation.set(file("${project.layout.buildDirectory.get().asFile}/reports/jacoco/index/jacoco.csv"))
    }

    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, excludes: [
                            "**/Q*.class"
                    ])
                })
        )
    }
}
