name: ssd-prod-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ssd-prod-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - ssd-net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ssd-prod-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.1.4
    container_name: ssd-prod-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - elasticsearch
    env_file:
      - .env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://dev-api.simsaimdang.shop/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ssd-prod-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ssd-prod-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.2.1
    container_name: ssd-prod-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.4.3
    container_name: ssd-prod-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/nginx:/var/log/nginx:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: ssd-prod-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring
      - ssd-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ssd-prod-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - monitoring

  es-bootstrap:
    image: curlimages/curl:8.8.0
    container_name: ssd-prod-es-bootstrap
    restart: "no"
    depends_on:
      - elasticsearch
    command:
      - /bin/sh
      - -c
      - |
        set -e
        until curl -sSf http://elasticsearch:9200 >/dev/null; do
          sleep 2
        done
        curl -sSf -X PUT \
          -H 'Content-Type: application/json' \
          http://elasticsearch:9200/_ilm/policy/ssd-logs-ilm \
          -d @/bootstrap/ilm-policy.json >/dev/null
        curl -sSf -X PUT \
          -H 'Content-Type: application/json' \
          http://elasticsearch:9200/_index_template/ssd-logs-template \
          -d @/bootstrap/index-template.json >/dev/null
        curl -sSf -X PUT \
          -H 'Content-Type: application/json' \
          http://elasticsearch:9200/_ingest/pipeline/ssd-logs-ingest \
          -d @/bootstrap/ingest-pipeline.json >/dev/null
        echo "[INFO] Elasticsearch bootstrap complete"
    volumes:
      - ./elasticsearch:/bootstrap:ro
    networks:
      - monitoring

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: ssd-prod-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      SERVER_BASEPATH: "/kibana"
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: "https://dev-api.simsaimdang.shop/kibana"
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - monitoring

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: ssd-prod-filebeat
    restart: unless-stopped
    user: root
    depends_on:
      - elasticsearch
      - es-bootstrap
    command:
      - filebeat
      - -e
      - --strict.perms=false
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/nginx:/var/log/nginx:ro
      - filebeat_data:/usr/share/filebeat/data
    networks:
      - monitoring

networks:
  monitoring:
    name: ssd-prod-monitoring
  ssd-net:
    external: true
    name: ssd-net

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:
  elasticsearch_data:
  filebeat_data:
