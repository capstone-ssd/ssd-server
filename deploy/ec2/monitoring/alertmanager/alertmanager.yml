global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: discord
  group_by: [alertname, severity, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: discord
    discord_configs:
      - send_resolved: true
        webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        title: '{{ template "ssd.discord.title" . }}'
        message: '{{ template "ssd.discord.message" . }}'
