name: develop-cd

on:
  push:
    branches: ["develop"]

concurrency:
  group: develop-cd-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DEPLOY_BUCKET: ssd-dev-assets-7bb4e2
      DEPLOY_PREFIX: cd/${{ github.sha }}
      INSTANCE_NAME: ssd-dev-app

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: application-dev.yml 생성
        env:
          APPLICATION_DEV: ${{ secrets.APPLICATION_DEV }}
        run: |
          mkdir -p .runtime
          FILE=.runtime/application-dev.yml
          rm -f "$FILE"
          printf '%s\n' "$APPLICATION_DEV" > "$FILE"

          if grep -Eq '^[[:space:]]*on-profile:[[:space:]]*local' "$FILE"; then
            echo "[WARN] application-dev.yml의 on-profile: local 을 dev로 보정합니다."
            perl -0pi -e 's/on-profile:\s*local/on-profile: dev/g' "$FILE"
          fi

      - name: dev 설정 필수값 검증
        run: |
          FILE=.runtime/application-dev.yml
          grep -Eq '^spring:' "$FILE" || { echo "[ERROR] spring 루트가 없습니다."; exit 1; }
          grep -Eq '^[[:space:]]*datasource:' "$FILE" || { echo "[ERROR] spring.datasource 블록이 없습니다."; exit 1; }
          grep -Eq '^[[:space:]]*url:[[:space:]]*jdbc:' "$FILE" || { echo "[ERROR] spring.datasource.url이 jdbc 형식이 아닙니다."; exit 1; }
          grep -Eq '^[[:space:]]*username:[[:space:]]*[^[:space:]].*' "$FILE" || { echo "[ERROR] spring.datasource.username이 비어 있습니다."; exit 1; }
          grep -Eq '^[[:space:]]*password:[[:space:]]*[^[:space:]].*' "$FILE" || { echo "[ERROR] spring.datasource.password가 비어 있습니다."; exit 1; }
          ! grep -Eq '^[[:space:]]*on-profile:[[:space:]]*local' "$FILE" || { echo "[ERROR] on-profile: local 이 남아 있습니다."; exit 1; }

      - name: 배포 스크립트 문법 검증
        run: |
          bash -n deploy/ec2/install_infra.sh
          bash -n deploy/ec2/install_prod_monitoring.sh
          bash -n deploy/ec2/blue_green_deploy.sh

      - name: Docker 레포지토리 이름 정규화
        env:
          RAW_DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
        run: |
          if [[ "${RAW_DOCKER_REPO##*/}" == *:* ]]; then
            DOCKER_REPO="${RAW_DOCKER_REPO%:*}"
          else
            DOCKER_REPO="${RAW_DOCKER_REPO}"
          fi
          echo "DOCKER_REPO=${DOCKER_REPO}" >> "$GITHUB_ENV"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKER_REPO }}:${{ github.sha }}
            ${{ env.DOCKER_REPO }}:develop-latest
          cache-from: type=gha,scope=develop-cd-docker
          cache-to: type=gha,mode=max,scope=develop-cd-docker

      - name: 배포 아카이브 생성
        run: |
          tar czf .runtime/deploy-ec2.tar.gz deploy/ec2

      - name: 배포 리소스 S3 업로드
        run: |
          aws s3 cp .runtime/application-dev.yml "s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/application-dev.yml"
          aws s3 cp .runtime/deploy-ec2.tar.gz "s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/deploy-ec2.tar.gz"

      - name: 대상 인스턴스 조회
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          if [[ -z "${INSTANCE_ID}" || "${INSTANCE_ID}" == "None" ]]; then
            echo "[ERROR] running instance not found for ${INSTANCE_NAME}" >&2
            exit 1
          fi
          echo "INSTANCE_ID=${INSTANCE_ID}" >> "$GITHUB_ENV"

      - name: SSM 배포 실행
        run: |
          cat > .runtime/ssm-deploy-commands.json <<JSON
          {
            "commands": [
              "set -eu",
              "rm -rf /home/ubuntu/ssd-deploy",
              "mkdir -p /home/ubuntu/ssd-deploy/.runtime",
              "aws s3 cp s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/application-dev.yml /home/ubuntu/ssd-deploy/.runtime/application-dev.yml",
              "aws s3 cp s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/deploy-ec2.tar.gz /tmp/deploy-ec2.tar.gz",
              "tar xzf /tmp/deploy-ec2.tar.gz -C /home/ubuntu/ssd-deploy",
              "chmod +x /home/ubuntu/ssd-deploy/deploy/ec2/install_infra.sh /home/ubuntu/ssd-deploy/deploy/ec2/install_prod_monitoring.sh /home/ubuntu/ssd-deploy/deploy/ec2/blue_green_deploy.sh",
              "export APP_NAME=ssd",
              "export DOCKER_REPO=${DOCKER_REPO}",
              "export IMAGE_TAG=${{ github.sha }}",
              "export SPRING_PROFILES_ACTIVE=dev",
              "export APP_CONFIG_SOURCE=/home/ubuntu/ssd-deploy/.runtime/application-dev.yml",
              "export APP_CONFIG_FILE=/opt/ssd/config/application-dev.yml",
              "export HEALTH_PATH=/swagger-ui/index.html",
              "export NETWORK_NAME=ssd-net",
              "export NGINX_SERVER_NAME=dev-api.simsaimdang.shop",
              "export NGINX_UPSTREAM_FILE=/etc/nginx/conf.d/ssd-upstream.conf",
              "export APP_LOG_DIR=/opt/ssd/logs",
              "sudo -E /home/ubuntu/ssd-deploy/deploy/ec2/install_infra.sh",
              "sudo -E /home/ubuntu/ssd-deploy/deploy/ec2/install_prod_monitoring.sh",
              "sudo -E /home/ubuntu/ssd-deploy/deploy/ec2/blue_green_deploy.sh"
            ]
          }
          JSON
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "develop-cd-${{ github.sha }}" \
            --parameters file://.runtime/ssm-deploy-commands.json \
            --query 'Command.CommandId' \
            --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

      - name: SSM 배포 결과 대기
        run: |
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query 'Status' --output text)
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "[ERROR] SSM deploy timed out" >&2
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output json || true
          exit 1

      - name: 임시 배포 파일 정리
        if: always()
        run: |
          aws s3 rm "s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/application-dev.yml" || true
          aws s3 rm "s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/deploy-ec2.tar.gz" || true
