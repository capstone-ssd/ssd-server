name: develop-cd

on:
  push:
    branches: ["develop"]

concurrency:
  group: develop-cd-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: 22
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DB_INSTANCE_IDENTIFIER: ssd-dev-postgres

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: application-dev.yml 생성
        env:
          APPLICATION_DEV: ${{ secrets.APPLICATION_DEV }}
        run: |
          mkdir -p .runtime
          FILE=.runtime/application-dev.yml
          rm -f "$FILE"
          printf '%s\n' "$APPLICATION_DEV" > "$FILE"

          if grep -Eq '^[[:space:]]*on-profile:[[:space:]]*local' "$FILE"; then
            echo "[WARN] application-dev.yml의 on-profile: local 을 dev로 보정합니다."
            perl -0pi -e 's/on-profile:\s*local/on-profile: dev/g' "$FILE"
          fi

      - name: RDS 엔드포인트 동기화
        run: |
          FILE=.runtime/application-dev.yml
          DB_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier "${DB_INSTANCE_IDENTIFIER}" \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          DB_ENDPOINT="${DB_ENDPOINT}" python3 -c 'from pathlib import Path; import os, re; path = Path(".runtime/application-dev.yml"); text = path.read_text(); endpoint = os.environ["DB_ENDPOINT"]; pattern = r"(url:\\s*jdbc:postgresql://)([^:/]+)(:\\d+/[^\\s]+)"; updated, count = re.subn(pattern, r"\\1" + endpoint + r"\\3", text, count=1); assert count == 1, "datasource url replacement failed"; path.write_text(updated)'

      - name: dev 설정 필수값 검증
        run: |
          FILE=.runtime/application-dev.yml
          grep -Eq '^spring:' "$FILE" || { echo "[ERROR] spring 루트가 없습니다."; exit 1; }
          grep -Eq '^[[:space:]]*datasource:' "$FILE" || { echo "[ERROR] spring.datasource 블록이 없습니다."; exit 1; }
          grep -Eq '^[[:space:]]*url:[[:space:]]*jdbc:' "$FILE" || { echo "[ERROR] spring.datasource.url이 jdbc 형식이 아닙니다."; exit 1; }
          grep -Eq '^[[:space:]]*username:[[:space:]]*[^[:space:]].*' "$FILE" || { echo "[ERROR] spring.datasource.username이 비어 있습니다."; exit 1; }
          grep -Eq '^[[:space:]]*password:[[:space:]]*[^[:space:]].*' "$FILE" || { echo "[ERROR] spring.datasource.password가 비어 있습니다."; exit 1; }
          ! grep -Eq '^[[:space:]]*on-profile:[[:space:]]*local' "$FILE" || { echo "[ERROR] on-profile: local 이 남아 있습니다."; exit 1; }

      - name: 배포 스크립트 문법 검증
        run: |
          bash -n deploy/ec2/install_infra.sh
          bash -n deploy/ec2/install_prod_monitoring.sh
          bash -n deploy/ec2/blue_green_deploy.sh

      - name: Docker 레포지토리 이름 정규화
        env:
          RAW_DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
        run: |
          if [[ "${RAW_DOCKER_REPO##*/}" == *:* ]]; then
            DOCKER_REPO="${RAW_DOCKER_REPO%:*}"
          else
            DOCKER_REPO="${RAW_DOCKER_REPO}"
          fi
          echo "DOCKER_REPO=${DOCKER_REPO}" >> "$GITHUB_ENV"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKER_REPO }}:${{ github.sha }}
            ${{ env.DOCKER_REPO }}:develop-latest
          cache-from: type=gha,scope=develop-cd-docker
          cache-to: type=gha,mode=max,scope=develop-cd-docker

      - name: 원격 배포 임시 경로 정리
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ env.SSH_PORT }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          script_stop: true
          script: |
            export DEPLOY_ROOT="/home/ubuntu/ssd-deploy"
            sudo docker system prune -af || true
            rm -rf "${DEPLOY_ROOT}"
            mkdir -p "${DEPLOY_ROOT}"

      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy_key
          chmod 600 ~/.ssh/id_deploy_key

      - name: 배포 리소스 전송
        env:
          HOST: ${{ secrets.HOST }}
        run: |
          SSH_OPTS="-i ~/.ssh/id_deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          DEPLOY_ROOT="/home/ubuntu/ssd-deploy"

          ssh ${SSH_OPTS} ubuntu@"${HOST}" "mkdir -p ${DEPLOY_ROOT}/.runtime"
          cat .runtime/application-dev.yml | ssh ${SSH_OPTS} ubuntu@"${HOST}" "cat > ${DEPLOY_ROOT}/.runtime/application-dev.yml"
          tar czf - deploy/ec2 | ssh ${SSH_OPTS} ubuntu@"${HOST}" "tar xzf - -C ${DEPLOY_ROOT}"

      - name: EC2 Blue/Green 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ env.SSH_PORT }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          script_stop: true
          script: |
            export DEPLOY_ROOT="/home/ubuntu/ssd-deploy"
            chmod +x "${DEPLOY_ROOT}/deploy/ec2/install_infra.sh" "${DEPLOY_ROOT}/deploy/ec2/install_prod_monitoring.sh" "${DEPLOY_ROOT}/deploy/ec2/blue_green_deploy.sh"
            export APP_NAME="ssd"
            export DOCKER_REPO="${{ env.DOCKER_REPO }}"
            export IMAGE_TAG="${{ github.sha }}"
            export SPRING_PROFILES_ACTIVE="dev"
            export APP_CONFIG_SOURCE="${DEPLOY_ROOT}/.runtime/application-dev.yml"
            export APP_CONFIG_FILE="/opt/ssd/config/application-dev.yml"
            export HEALTH_PATH="/swagger-ui/index.html"
            export NETWORK_NAME="ssd-net"
            export NGINX_SERVER_NAME="dev-api.simsaimdang.shop"
            export NGINX_ENABLE_SSL="false"
            export NGINX_UPSTREAM_FILE="/etc/nginx/conf.d/ssd-upstream.conf"
            export APP_LOG_DIR="/opt/ssd/logs"
            sudo -E "${DEPLOY_ROOT}/deploy/ec2/install_infra.sh"
            sudo -E "${DEPLOY_ROOT}/deploy/ec2/install_prod_monitoring.sh"
            sudo -E "${DEPLOY_ROOT}/deploy/ec2/blue_green_deploy.sh"
